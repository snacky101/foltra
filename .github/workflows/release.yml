name: Release macOS update

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, for example v0.1.0-preview.2'
        required: true
        type: string

permissions:
  contents: read

# Version tags are immutable. Serialize promotion of the one shared update feed.
concurrency:
  group: foltra-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'snacky101/foltra'
    runs-on: macos-15
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - name: Check out the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Check versions, source commit, and update order
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-update.mjs preflight "$RELEASE_TAG"

      - name: Set up Rust
        if: steps.preflight.outputs.build == 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Rust build
        if: steps.preflight.outputs.build == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install frontend dependencies
        if: steps.preflight.outputs.build == 'true'
        run: npm ci

      - name: Test the app
        if: steps.preflight.outputs.build == 'true'
        run: |
          npm test
          cargo test --locked -p foltra-desktop

      - name: Check the app
        if: steps.preflight.outputs.build == 'true'
        run: npm run check

      - name: Build signed app and DMG
        if: steps.preflight.outputs.build == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Missing updater signing key'; exit 1; }
          npm run release:mac

      - name: Build CLI
        if: steps.preflight.outputs.build == 'true'
        run: cargo build --release --locked -p foltra-cli

      - name: Publish verified assets and promote the update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-update.mjs publish "$RELEASE_TAG"
