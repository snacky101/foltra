name: Release macOS update
run-name: Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing immutable version tag, for example v0.1.0-preview.5'
        required: true
        type: string

permissions:
  contents: read

# Run on main so dependency caches survive across version tags. Every job still
# checks out the exact release commit, never main's application source.
concurrency:
  group: foltra-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}
  MACOSX_DEPLOYMENT_TARGET: '11.0'
  CARGO_BUILD_JOBS: '2'

jobs:
  preflight:
    if: github.repository == 'snacky101/foltra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.preflight.outputs.build }}
      head: ${{ steps.preflight.outputs.head }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Check versions, source commit, and update order
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-update.mjs preflight "$RELEASE_TAG"

  validate:
    needs: preflight
    if: needs.preflight.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preflight.outputs.head }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Cache validation dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: validation
          cache-on-failure: true
          env-vars: MACOSX_DEPLOYMENT_TARGET
      - run: npm ci
      - name: Test the app
        run: |
          npm test
          cargo test --locked -p foltra-desktop
          node scripts/build-storage.mjs check
      - name: Check the app
        run: npm run check

  build:
    needs: preflight
    if: needs.preflight.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      artifact-id: ${{ steps.assets.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preflight.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Cache release dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release
          cache-on-failure: true
          env-vars: MACOSX_DEPLOYMENT_TARGET
      - run: npm ci
      - name: Build signed app, DMG, and CLI together
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # A single Cargo invocation unifies shared features and builds DuckDB once.
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Missing updater signing key'; exit 1; }
          npm run release:mac -- -- --locked --workspace
          node scripts/build-storage.mjs check
      - name: Verify and seal build artifacts for this source and workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-update.mjs prepare "$RELEASE_TAG"
      - name: Retain verified assets for publication retries
        id: assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ needs.preflight.outputs.head }}-${{ github.run_attempt }}
          path: target/release/update-assets/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: [preflight, validate, build]
    if: >-
      always() && !cancelled() && needs.preflight.result == 'success' &&
      ((needs.preflight.outputs.build == 'true' && needs.validate.result == 'success' && needs.build.result == 'success') ||
       (needs.preflight.outputs.build == 'false' && needs.validate.result == 'skipped' && needs.build.result == 'skipped'))
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preflight.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Download this run's verified build
        if: needs.preflight.outputs.build == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: target/release/update-assets/
          merge-multiple: true
      - name: Publish verified assets and promote the update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-update.mjs publish "$RELEASE_TAG" --prepared target/release/update-assets
